<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>夸克网盘全能管理工具</title>
  <style>
    :root {
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --bg: #09090B;
      --card-bg: #18181B;
      --border: #27272A;
      --text: #FAFAFA;
      --text-sub: #A1A1AA;
      --success: #22C55E;
      --warn: #F59E0B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 320px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .logo-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .title-group h1 {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--text);
    }

    .title-group p {
      font-size: 11px;
      color: var(--text-sub);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .status-item:last-child {
      margin-bottom: 0;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-success {
      background: rgba(34, 197, 94, 0.12);
      color: #4ADE80;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    .badge-warn {
      background: rgba(245, 158, 11, 0.12);
      color: #FBBF24;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: var(--primary);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .tips {
      font-size: 11px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    .tips ul {
      padding-left: 16px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </div>
    <div class="title-group">
      <h1>夸克网盘全能管理工具</h1>
      <p>v3.0.2 · <a href="https://github.com/LZ7TOP" target="_blank" style="color: #60a5fa; text-decoration: none;">LZ7 工作室</a></p>
    </div>
  </div>

  <div class="card">
    <div class="status-item">
      <span>网盘页面检测</span>
      <span id="pageStatus" class="badge badge-warn">检测中...</span>
    </div>
    <div class="status-item">
      <span>目录 FID</span>
      <span id="fidStatus" style="color: var(--text-sub); font-family: monospace;">-</span>
    </div>
  </div>

  <button id="openPanelBtn" class="btn">
    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    <span>呼出批量重命名面板</span>
  </button>

  <div class="card" style="margin-top: 14px; margin-bottom: 0;">
    <div class="tips">
      <strong>使用提示：</strong>
      <ul>
        <li>打开夸克网盘网页端；</li>
        <li>进入任意需要改名的文件夹；</li>
        <li>点击页面右下角或本插件中的“呼出批量重命名面板”。</li>
      </ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
